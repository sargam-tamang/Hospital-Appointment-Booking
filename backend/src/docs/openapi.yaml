
openapi: 3.1.0

info:
  title: Doctor Appointment Booking API
  version: 1.0.0
  description: |
    REST API for a doctor appointment booking system.
    This API supports patient-facing functionality including
    hospital discovery, doctor discovery, appointment booking,
    appointment management, and user profiles.

servers:
  - url: http://localhost:3000/
    description: Local development server

tags:
  - name: Hospitals
    description: Browse hospitals and discover hospitals by location.
  - name: Doctors
    description: Browse doctors, specializations, and availability.
  - name: Appointments
    description: Book, view, cancel, and reschedule appointments.
  - name: Users
    description: Retrieve and update user profiles.
  - name: Specializations
    description: Browse available medical specializations.
  - name: Discovery
    description: Search across doctors and hospitals and browse cities.

