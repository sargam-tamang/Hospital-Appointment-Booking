<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qikify Chat - RAG System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f0f0;display:flex;justify-content:center;padding:20px}
.chat-container{width:380px;height:600px;background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);display:flex;flex-direction:column;overflow:hidden}
.header{background:#7c3aed;color:white;padding:16px;text-align:center;font-weight:600}
.chat-box{flex:1;overflow-y:auto;padding:16px;background:#f9f9fb}
.bot-msg{display:flex;gap:8px;margin-bottom:12px}
.icon{width:32px;height:32px;background:#ede9fe;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.bubble{padding:10px 14px;border-radius:18px;max-width:240px;font-size:14px}
.bot{background:white;border:1px solid #e5e7eb;border-bottom-left-radius:4px}
.user{background:#7c3aed;color:white;margin-left:auto;border-bottom-right-radius:4px}
.option{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #e5e7eb;border-radius:8px;background:white;text-align:left;font-size:13px;cursor:pointer}
.option:hover{background:#f3f4f6}
.input-area{padding:12px;border-top:1px solid #e5e7eb;display:flex;gap:8px}
.input-area input{flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:24px;outline:none}
.input-area button{background:#7c3aed;color:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">qikify Support Chat</div>
  <div class="chat-box" id="chatBox">
    <div class="bot-msg">
      <div class="icon">🤖</div>
      <div>
        <div class="bubble bot">How can we help you today?</div>
        <button class="option" onclick="quickReply('Search Support Articles')">Search Support Articles</button>
        <button class="option" onclick="quickReply('Submit Support Ticket')">Submit Support Ticket</button>
      </div>
    </div>
  </div>
  <div class="input-area">
    <input id="userInput" placeholder="Type hereeee..." onkeypress="if(event.key==='Enter')send()" />
    <button onclick="send()">➤</button>
  </div>
</div>
<script>
function addMsg(text,type){
 const box=document.getElementById('chatBox');
 const div=document.createElement('div');
 div.style.display='flex'; div.style.justifyContent= type==='user'?'flex-end':'flex-start'; div.style.marginBottom='12px';
 div.innerHTML=`<div class="bubble ${type}">${text}</div>`;
 box.appendChild(div); box.scrollTop=box.scrollHeight;
}
function send(){
 const inp=document.getElementById('userInput');
 if(!inp.value.trim())return;
 addMsg(inp.value,'user');
 setTimeout(()=>addMsg('Searching knowledge base via RAG... I found relevant articles for: '+inp.value,'bot'),800);
 inp.value='';
}
function quickReply(t){document.getElementById('userInput').value=t;send();}
</script>
</body>
</html>
